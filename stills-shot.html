<!DOCTYPE html>
<meta charset="utf-8">
<title>stills shot</title>
<style>html,body{margin:0;background:#111;color:#ddd;font:13px monospace}
iframe{border:0;display:block}#log{padding:6px}</style>
<div id="log">booting…</div>
<iframe id="f" src="index.html" width="900" height="640"></iframe>
<script>
// Temporary dev harness, same shape as shadow-shot.html: boots the game, then
// injects tools/stills-capture.js into the booted document so it can render one
// still per enemy and per foliage tile through the game's own draw code. The
// stills are POSTed to tools/stills-server.py, which has to be the server
// answering — plain `python3 -m http.server` has no upload route.
//
// Not part of the game; index.html never loads this.
const f = document.getElementById('f');
const log = document.getElementById('log');
f.onload = () => setTimeout(() => {
  const w = f.contentWindow;
  const btn = t => [...w.document.querySelectorAll('button')].find(b => b.textContent.includes(t));
  try {
    btn('skip').click();
    const i = w.document.querySelector('input[type=text]');
    if (i) i.value = 'Dev';
    btn('Begin Adventure').click();
  } catch (e) { log.textContent = 'boot failed: ' + e.message; return; }
  // The 500ms is load timing, not superstition: the sprite sheets have to be in
  // before anything asks them to draw.
  setTimeout(() => {
    const s = w.document.createElement('script');
    s.src = 'tools/stills-capture.js';
    w.document.body.appendChild(s);
    setInterval(() => { log.textContent = w.__stills || 'running…'; }, 400);
  }, 500);
}, 1000);
</script>
