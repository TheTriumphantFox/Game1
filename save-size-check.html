<!DOCTYPE html>
<meta charset="utf-8">
<title>save size check</title>
<style>html,body{margin:0;background:#111;color:#ddd;font:13px monospace}iframe{border:0}</style>
<pre id="log">booting…</pre>
<iframe id="f" src="index.html" width="900" height="500"></iframe>
<script>
// Development harness. It boots the real game, then injects the save-size
// verifier so the quota regression runs without adding a production dependency.
const f = document.getElementById('f'), log = document.getElementById('log');
f.onload = () => setTimeout(() => {
  const w = f.contentWindow;
  const btn = text => [...w.document.querySelectorAll('button')]
    .find(button => button.textContent.includes(text));
  try {
    btn('skip').click();
    const input = w.document.querySelector('input[type=text]');
    if (input) input.value = 'Dev';
    btn('Begin Adventure').click();
  } catch (e) {
    log.textContent = 'boot failed: ' + e.message;
    return;
  }
  setTimeout(() => {
    const script = w.document.createElement('script');
    script.src = 'tools/verify-save-size.js';
    script.onerror = () => { log.textContent = 'inject failed'; };
    w.document.body.appendChild(script);
    const timer = setInterval(() => {
      if (!w.__saveSizeCheck) return;
      clearInterval(timer);
      log.textContent = JSON.stringify(w.__saveSizeCheck, null, 1);
      document.title = w.document.title;
    }, 300);
  }, 500);
}, 1000);
</script>
