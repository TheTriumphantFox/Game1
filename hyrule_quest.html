<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const TS = 16;             // tile size in logical px
const MCOLS = 150;
const MROWS = 150;

// Exit positions — centre of each edge
const EXIT_COL = Math.floor(MCOLS / 2);
const EXIT_ROW = Math.floor(MROWS / 2);

// Dynamic viewport — fills the window, recomputed on resize
let TILE_PX = 48;   // rendered pixels per tile (zoom level)
let VCOLS = 1, VROWS = 1, PW = 1, PH = 1;

function resizeCanvas() {
  const hudH = document.getElementById('hud')?.offsetHeight || 0;
  const msgH = document.getElementById('msg-bar')?.offsetHeight || 0;
  const wepH = document.getElementById('weapon-bar')?.offsetHeight || 0;
  const ctrlH = document.getElementById('ctrl-bar')?.offsetHeight || 0;
  const saveH = document.getElementById('save-row')?.offsetHeight || 0;
  const usedH = hudH + msgH + wepH + ctrlH + saveH;
  canvas.width  = window.innerWidth;
  canvas.height = Math.max(window.innerHeight - usedH, 200);
  PW = canvas.width;
  PH = canvas.height;
  VCOLS = Math.ceil(PW / TILE_PX) + 2;
  VROWS = Math.ceil(PH / TILE_PX) + 2;
  // Only clamp if camera coords are initialised
  if (typeof camC !== 'undefined') clampCam();
}
window.addEventListener('resize', resizeCanvas);

const T = {
  GRASS:0, TREE:1, WATER:2, PATH:3, WALL:4, FLOOR:5,
  CHEST:6, DOOR:7, ROCK:8, SAND:9, FLOWER:10, DUNGEON_DOOR:11,
  DEEP_WATER:12, LAVA:13, BRIDGE:14, PILLAR:15, TORCH:16, STATUE:17,
  SHRINE:18, MUSHROOM:19, FERN:20
};

// ─── Tile helpers ─────────────────────────────────────────────────────────────
function makeTile(rows, cols, fill) {
  const m = [];
  for (let r = 0; r < rows; r++) { m.push(new Uint8Array(cols).fill(fill)); }
  return m;
}
function setRect(m, r1, c1, r2, c2, t) {
  for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) m[r][c] = t;
}
function setRow(m, r, c1, c2, t) { for (let c = c1; c <= c2; c++) m[r][c] = t; }
function setCol(m, c, r1, r2, t) { for (let r = r1; r <= r2; r++) m[r][c] = t; }
function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

// ─── Map generators ───────────────────────────────────────────────────────────

// Carve a winding path using a drunk walk
function drunkWalk(m, sr, sc, er, ec, t, width) {
  let r = sr, c = sc;
  const maxSteps = (MROWS + MCOLS) * 4;
  for (let i = 0; i < maxSteps && (Math.abs(r - er) + Math.abs(c - ec)) > 3; i++) {
    const dr = er - r, dc = ec - c;
    let mr = 0, mc = 0;
    if (Math.random() < 0.65) { // bias toward target
      if (Math.abs(dr) > Math.abs(dc)) mr = Math.sign(dr);
      else mc = Math.sign(dc);
    } else {
      if (Math.random() < 0.5) mr = (Math.random() < 0.5 ? 1 : -1);
      else mc = (Math.random() < 0.5 ? 1 : -1);
    }
    r = Math.max(1, Math.min(MROWS - 2, r + mr));
    c = Math.max(1, Math.min(MCOLS - 2, c + mc));
    for (let dr2 = -width; dr2 <= width; dr2++)
      for (let dc2 = -width; dc2 <= width; dc2++) {
        const nr = r + dr2, nc = c + dc2;
        if (nr > 0 && nr < MROWS - 1 && nc > 0 && nc < MCOLS - 1) m[nr][nc] = t;
      }
  }
  // Ensure endpoint
  for (let dr2 = -width; dr2 <= width; dr2++)
    for (let dc2 = -width; dc2 <= width; dc2++) {
      const nr = er + dr2, nc = ec + dc2;
      if (nr > 0 && nr < MROWS - 1 && nc > 0 && nc < MCOLS - 1) m[nr][nc] = t;
    }
}

// Scatter decorations
function scatter(m, tile, count, avoidSolid, mapRef) {
  for (let i = 0; i < count; i++) {
    const r = rnd(2, MROWS - 3), c = rnd(2, MCOLS - 3);
    // Only place on plain grass — don't overwrite chests, shrines, torches etc
    if (m[r][c] !== T.GRASS) continue;
    if (!avoidSolid || !isSolid(mapRef || m, c, r)) m[r][c] = tile;
  }
}

function isSolid(map, c, r) {
  if (c < 0 || r < 0 || c >= MCOLS || r >= MROWS) return true;
  const t = map[r][c];
  return t === T.TREE || t === T.WATER || t === T.WALL || t === T.ROCK ||
         t === T.DEEP_WATER || t === T.LAVA || t === T.PILLAR || t === T.STATUE;
}

// Open exit gates (3-wide corridors on each border edge)
function cutExits(m, hasLeft, hasRight, hasUp, hasDown) {
  const ft = T.PATH;
  if (hasRight) { for (let dr = -2; dr <= 2; dr++) { const r = EXIT_ROW + dr; if (r > 0 && r < MROWS - 1) m[r][MCOLS - 1] = ft; } }
  if (hasLeft)  { for (let dr = -2; dr <= 2; dr++) { const r = EXIT_ROW + dr; if (r > 0 && r < MROWS - 1) m[r][0] = ft; } }
  if (hasDown)  { for (let dc = -2; dc <= 2; dc++) { const c = EXIT_COL + dc; if (c > 0 && c < MCOLS - 1) m[MROWS - 1][c] = ft; } }
  if (hasUp)    { for (let dc = -2; dc <= 2; dc++) { const c = EXIT_COL + dc; if (c > 0 && c < MCOLS - 1) m[0][c] = ft; } }
}

// Ensure every passable tile is reachable from the exits.
// Flood-fill from the 4 exit tiles. Any passable tile not reached gets either
// (a) connected back to the reachable area via a corridor (if it contains a
// chest, shrine, or other important content), or (b) sealed as TREE.
function ensureConnectivity(m, preserveFloor) {
  const W = MCOLS, H = MROWS;
  const reachable = new Uint8Array(W * H);
  const stack = [];

  const passable = (c, r) => {
    if (c < 0 || r < 0 || c >= W || r >= H) return false;
    const t = m[r][c];
    return !(t === T.TREE || t === T.WATER || t === T.WALL || t === T.ROCK ||
             t === T.DEEP_WATER || t === T.LAVA || t === T.PILLAR || t === T.STATUE);
  };

  const isInteresting = (t) =>
    t === T.CHEST || t === T.SHRINE || t === T.TORCH ||
    t === T.DUNGEON_DOOR || t === T.DOOR ||
    (preserveFloor && t === T.FLOOR);

  // Seed flood from exit tiles
  const seeds = [
    [EXIT_ROW, 0], [EXIT_ROW, W - 1],
    [0, EXIT_COL], [H - 1, EXIT_COL]
  ];
  for (const [sr, sc] of seeds) {
    if (passable(sc, sr)) {
      reachable[sr * W + sc] = 1;
      stack.push([sr, sc]);
    }
  }

  // BFS/DFS flood
  while (stack.length) {
    const [r, c] = stack.pop();
    for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= H || nc < 0 || nc >= W) continue;
      if (reachable[nr * W + nc]) continue;
      if (!passable(nc, nr)) continue;
      reachable[nr * W + nc] = 1;
      stack.push([nr, nc]);
    }
  }

  // Pass 1: for any unreachable INTERESTING tile, carve a path to the nearest
  // reachable tile so the player isn't locked out of treasure.
  for (let r = 1; r < H - 1; r++) {
    for (let c = 1; c < W - 1; c++) {
      if (reachable[r * W + c]) continue;
      if (!isInteresting(m[r][c])) continue;
      // Find nearest reachable tile via expanding rings (bounded search)
      let found = null;
      for (let radius = 1; radius <= 30 && !found; radius++) {
        for (let dr = -radius; dr <= radius && !found; dr++) {
          for (let dc = -radius; dc <= radius; dc++) {
            if (Math.abs(dr) !== radius && Math.abs(dc) !== radius) continue;
            const tr = r + dr, tc = c + dc;
            if (tr < 1 || tr >= H - 1 || tc < 1 || tc >= W - 1) continue;
            if (reachable[tr * W + tc]) { found = {r: tr, c: tc}; break; }
          }
        }
      }
      if (found) {
        // Carve a straight-ish path from (r,c) to found
        let pr = r, pc = c;
        const safety = Math.abs(r - found.r) + Math.abs(c - found.c) + 4;
        for (let step = 0; step < safety; step++) {
          if (pr === found.r && pc === found.c) break;
          // Only overwrite non-interesting tiles with PATH so we don't erase the chest
          if (!isInteresting(m[pr][pc])) m[pr][pc] = T.PATH;
          reachable[pr * W + pc] = 1;
          if (pr !== found.r && (pc === found.c || Math.random() < 0.5)) {
            pr += Math.sign(found.r - pr);
          } else {
            pc += Math.sign(found.c - pc);
          }
        }
      }
    }
  }

  // Pass 2: anything still unreachable AND passable gets sealed as TREE
  // so the player isn't teased by visible but inaccessible terrain.
  for (let r = 1; r < H - 1; r++) {
    for (let c = 1; c < W - 1; c++) {
      if (reachable[r * W + c]) continue;
      const t = m[r][c];
      if (!passable(c, r)) continue;
      // Preserve interesting tiles even if we failed to connect — they're rare
      if (isInteresting(t)) continue;
      m[r][c] = T.TREE;
    }
  }
}


// Forest map variants
const FOREST_NAMES = [
  'Whispering Grove','Mossy Hollow','Thornwood Pass','Shadowed Glade',
  'Fernwood Thicket','Ancient Canopy','Bogwood Crossing','Moonlit Clearing',
  'Crimson Oak Dell','Twisted Roots','Spider Hollow','Frostvine Path',
  'Elder Stump','Lanternfly Glade','Fungal Depths','Ruins of Sylvan',
  'Brookside Thicket','Mirkwood Passage','Glowshroom Hollow','Bramblewood'
];

function buildForestMap(seed, depth) {
  // seeded-ish variation using depth
  const m = makeTile(MROWS, MCOLS, T.TREE);

  // Carve open regions using cellular-automata-style passes + drunk walks
  // First: place random open patches
  const patchCount = 60 + depth * 2;
  for (let i = 0; i < patchCount; i++) {
    const pr = rnd(5, MROWS - 6), pc = rnd(5, MCOLS - 6);
    const pw = rnd(3, 10), ph = rnd(3, 10);
    setRect(m, pr, pc, Math.min(pr + ph, MROWS - 2), Math.min(pc + pw, MCOLS - 2), T.GRASS);
  }

  // Carve winding paths connecting all 4 exits + centre
  const midR = Math.floor(MROWS / 2), midC = Math.floor(MCOLS / 2);
  drunkWalk(m, midR, midC, 1, EXIT_COL, T.PATH, 1);              // to top
  drunkWalk(m, midR, midC, MROWS - 2, EXIT_COL, T.PATH, 1);      // to bottom
  drunkWalk(m, midR, midC, EXIT_ROW, 1, T.PATH, 1);              // to left
  drunkWalk(m, midR, midC, EXIT_ROW, MCOLS - 2, T.PATH, 1);      // to right
  // Extra wandering paths for variety
  for (let i = 0; i < 6; i++) {
    const r1 = rnd(10, MROWS - 10), c1 = rnd(10, MCOLS - 10);
    const r2 = rnd(10, MROWS - 10), c2 = rnd(10, MCOLS - 10);
    drunkWalk(m, r1, c1, r2, c2, T.GRASS, 1);
  }

  // Clearings with special content
  const clearings = [];
  for (let i = 0; i < 8; i++) {
    const cr = rnd(15, MROWS - 15), cc = rnd(15, MCOLS - 15);
    const cr2 = rnd(8, 16), cc2 = rnd(8, 16);
    setRect(m, cr, cc, Math.min(cr + cr2, MROWS - 2), Math.min(cc + cc2, MCOLS - 2), T.GRASS);
    clearings.push({r: cr + Math.floor(cr2 / 2), c: cc + Math.floor(cc2 / 2)});
  }

  const waterCount = 2 + Math.floor(depth / 4);
  for (let i = 0; i < waterCount; i++) {
    const wr = rnd(20, MROWS - 25), wc = rnd(20, MCOLS - 25);
    const ws = rnd(5, 12);
    const wr2 = Math.min(wr + ws, MROWS - 2), wc2 = Math.min(wc + ws, MCOLS - 2);
    setRect(m, wr, wc, wr2, wc2, T.WATER);
    if (wr2 - wr > 4 && wc2 - wc > 4)
      setRect(m, wr + 2, wc + 2, wr2 - 2, wc2 - 2, T.DEEP_WATER);
    // Bridge across water mid-row
    const bridgeR = Math.floor((wr + wr2) / 2);
    setRow(m, bridgeR, Math.max(1, wc - 1), Math.min(MCOLS - 2, wc2 + 1), T.BRIDGE);
  }

  // Rocks scattered
  for (let i = 0; i < 80 + depth; i++) {
    const rr = rnd(2, MROWS - 3), rc = rnd(2, MCOLS - 3);
    if (m[rr][rc] === T.GRASS || m[rr][rc] === T.PATH) {
      // only place on passable — sparse
      if (Math.random() < 0.3) m[rr][rc] = T.ROCK;
    }
  }

  // Flowers, mushrooms, ferns
  scatter(m, T.FLOWER, 200, true, m);
  scatter(m, T.MUSHROOM, 150, true, m);
  scatter(m, T.FERN, 180, true, m);

  // Chests in clearings
  const chestCount = 2 + Math.floor(depth / 3);
  for (let i = 0; i < Math.min(chestCount, clearings.length); i++) {
    const cl = clearings[i];
    m[cl.r][cl.c] = T.CHEST;
  }

  // Shrine in one clearing
  if (clearings.length > 0 && Math.random() < 0.4) {
    const cl = clearings[Math.floor(Math.random() * clearings.length)];
    m[cl.r][cl.c] = T.SHRINE;
    if (cl.c > 0)         m[cl.r][cl.c - 1] = T.TORCH;
    if (cl.c < MCOLS - 1) m[cl.r][cl.c + 1] = T.TORCH;
  }

  if (depth > 5 && Math.random() < 0.5) {
    const dr = rnd(30, MROWS - 40), dc = rnd(30, MCOLS - 40);
    // Avoid blocking exit corridors
    const tooCloseToExit = Math.abs(dr - EXIT_ROW) < 8 || Math.abs(dc - EXIT_COL) < 8;
    if (!tooCloseToExit) {
      setRect(m, dr, dc, dr + 6, dc + 8, T.FLOOR);
      m[dr + 3][dc + 4] = T.DUNGEON_DOOR;
      m[dr][dc] = T.PILLAR; m[dr][dc + 8] = T.PILLAR;
      m[dr + 6][dc] = T.PILLAR; m[dr + 6][dc + 8] = T.PILLAR;
      m[dr + 1][dc + 3] = T.TORCH; m[dr + 1][dc + 5] = T.TORCH;
    }
  }

  // Ensure exits are open
  cutExits(m, true, true, true, true);

  // Guarantee exit corridors reach interior — run drunkwalk from edges
  drunkWalk(m, EXIT_ROW, 1, EXIT_ROW, midC, T.PATH, 1);
  drunkWalk(m, EXIT_ROW, MCOLS - 2, EXIT_ROW, midC, T.PATH, 1);
  drunkWalk(m, 1, EXIT_COL, midR, EXIT_COL, T.PATH, 1);
  drunkWalk(m, MROWS - 2, EXIT_COL, midR, EXIT_COL, T.PATH, 1);

  // Final border lock (except exits)
  for (let c = 0; c < MCOLS; c++) { m[0][c] = T.TREE; m[MROWS - 1][c] = T.TREE; }
  for (let r = 0; r < MROWS; r++) { m[r][0] = T.TREE; m[r][MCOLS - 1] = T.TREE; }
  cutExits(m, true, true, true, true);

  ensureConnectivity(m);

  return m;
}

function buildVillageMap() {
  const m = makeTile(MROWS, MCOLS, T.PATH);

  // Forest border
  for (let r = 0; r < MROWS; r++) { m[r][0] = T.TREE; m[r][MCOLS - 1] = T.TREE; }
  for (let c = 0; c < MCOLS; c++) { m[0][c] = T.TREE; m[MROWS - 1][c] = T.TREE; }
  // Forest ring (inner)
  for (let r = 1; r < 8; r++) for (let c = 1; c < MCOLS - 1; c++) m[r][c] = T.TREE;
  for (let r = MROWS - 8; r < MROWS - 1; r++) for (let c = 1; c < MCOLS - 1; c++) m[r][c] = T.TREE;
  for (let r = 1; r < MROWS - 1; r++) for (let c = 1; c < 8; c++) m[r][c] = T.TREE;
  for (let r = 1; r < MROWS - 1; r++) for (let c = MCOLS - 8; c < MCOLS - 1; c++) m[r][c] = T.TREE;

  // Village plaza
  setRect(m, 8, 8, MROWS - 9, MCOLS - 9, T.PATH);

  // Central square / fountain
  const midR = Math.floor(MROWS / 2), midC = Math.floor(MCOLS / 2);
  setRect(m, midR - 8, midC - 8, midR + 8, midC + 8, T.SAND);
  setRect(m, midR - 4, midC - 4, midR + 4, midC + 4, T.WATER);
  m[midR][midC] = T.STATUE;
  m[midR - 5][midC - 5] = T.TORCH; m[midR - 5][midC + 5] = T.TORCH;
  m[midR + 5][midC - 5] = T.TORCH; m[midR + 5][midC + 5] = T.TORCH;

  // Houses
  function house(r1, c1, w, h) {
    setRect(m, r1, c1, r1 + h, c1 + w, T.WALL);
    setRect(m, r1 + 1, c1 + 1, r1 + h - 1, c1 + w - 1, T.FLOOR);
    m[r1 + h][c1 + Math.floor(w / 2)] = T.DOOR;
    m[r1 + 1][c1 + 1] = T.TORCH; m[r1 + 1][c1 + w - 1] = T.TORCH;
    // Chest inside each house
    m[r1 + 2][c1 + Math.floor(w / 2)] = T.CHEST;
  }
  const hw = 16, hh = 12;
  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < 5; col++) {
      const hr = 14 + row * (hh + 14);
      const hc = 14 + col * (hw + 16);
      if (hr + hh < MROWS - 14 && hc + hw < MCOLS - 14) {
        house(hr, hc, hw, hh);
      }
    }
  }

  // Roads between houses
  setRow(m, midR - 20, 8, MCOLS - 9, T.PATH);
  setRow(m, midR, 8, MCOLS - 9, T.PATH);
  setRow(m, midR + 20, 8, MCOLS - 9, T.PATH);
  setCol(m, midC - 20, 8, MROWS - 9, T.PATH);
  setCol(m, midC, 8, MROWS - 9, T.PATH);
  setCol(m, midC + 20, 8, MROWS - 9, T.PATH);

  // Flowers along roads
  scatter(m, T.FLOWER, 120, true, m);

  // Exit paths
  cutExits(m, true, true, true, true);
  // Connect exits to village
  drunkWalk(m, EXIT_ROW, 1, EXIT_ROW, midC, T.PATH, 2);
  drunkWalk(m, EXIT_ROW, MCOLS - 2, EXIT_ROW, midC, T.PATH, 2);
  drunkWalk(m, 1, EXIT_COL, midR, EXIT_COL, T.PATH, 2);
  drunkWalk(m, MROWS - 2, EXIT_COL, midR, EXIT_COL, T.PATH, 2);

  for (let c = 0; c < MCOLS; c++) { m[0][c] = T.TREE; m[MROWS - 1][c] = T.TREE; }
  for (let r = 0; r < MROWS; r++) { m[r][0] = T.TREE; m[r][MCOLS - 1] = T.TREE; }
  cutExits(m, true, true, true, true);

  // Village uses house interiors (FLOOR) that are intentionally walled off.
  // Pre-mark all FLOOR tiles as "preserved" so ensureConnectivity doesn't seal them.
  ensureConnectivity(m, true /* preserveFloor */);

  return m;
}

// Enemy pools by depth tier
const ENEMY_POOLS = [
  ['goblin','wolf','pixie'],           // tier 0: maps 1-4
  ['goblin','wolf','skeleton','dryad','pixie'], // tier 1: maps 5-8
  ['skeleton','zombie','cultist','dryad','owlbear'], // tier 2: maps 9-12
  ['zombie','cultist','owlbear','troll','displacer','wraith'], // tier 3: maps 13-16
  ['troll','wyvern','vampire','wraith','beholder','lich'],    // tier 4: maps 17-20
  ['lich','beholder','treant','wyvern','lich_boss'],          // tier 5: village
];

function getEnemyPool(depth) {
  const tier = Math.min(Math.floor(depth / 4), ENEMY_POOLS.length - 1);
  return ENEMY_POOLS[tier];
}

function makeEnemyDefs(depth, mapType) {
  const pool = getEnemyPool(depth);
  const count = 4 + Math.floor(depth / 2);
  const defs = [];
  const spread = 20;
  for (let i = 0; i < count; i++) {
    const type = pool[Math.floor(Math.random() * pool.length)];
    defs.push({
      type,
      x: rnd(spread, MCOLS - spread),
      y: rnd(spread, MROWS - spread)
    });
  }
  // Boss on village map
  if (mapType === 'village') {
    defs.push({type: 'lich_boss', x: Math.floor(MCOLS / 2), y: Math.floor(MROWS / 2) - 10});
  }
  return defs;
}

// ─── World state ──────────────────────────────────────────────────────────────
// Maps are stored in worldMaps[] by id.
// worldGrid: "gx,gy" → mapId — the global spatial index that makes loops work.
let worldMaps = [];
let worldGrid = {};   // "gx,gy" → mapId
let currentMapId = 0;
let mapsVisited = 0;
let mapSequence = [];

const DIR_DELTA = { right:{dx:1,dy:0}, left:{dx:-1,dy:0}, down:{dx:0,dy:1}, up:{dx:0,dy:-1} };

function gridKey(gx, gy) { return `${gx},${gy}`; }

function initWorld() {
  worldMaps = [];
  worldGrid = {};
  mapsVisited = 1;
  mapSequence = [0];
  const firstMap = createForestMap(0, 0, 0);   // gx=0, gy=0
  worldMaps.push(firstMap);
  worldGrid[gridKey(0, 0)] = 0;
  currentMapId = 0;
}

function createForestMap(id, gx, gy) {
  const depth = Math.min(mapsVisited, 20);
  const name = depth >= 20
    ? 'Village of the Lost'
    : FOREST_NAMES[Math.floor(Math.random() * FOREST_NAMES.length)] + ` [${mapsVisited + 1}]`;
  const type = depth >= 20 ? 'village' : 'forest';
  const mapTiles = type === 'village' ? buildVillageMap() : buildForestMap(id, depth);
  const enemyDefs = makeEnemyDefs(depth, type);
  return {
    id, gx, gy, name, type, map: mapTiles,
    enemyDefs, openedChests: new Set(),
    visited: false, depth
  };
}

function getOrCreateNeighbor(direction) {
  const cur = worldMaps[currentMapId];
  const { dx, dy } = DIR_DELTA[direction];
  const ngx = cur.gx + dx, ngy = cur.gy + dy;
  const key = gridKey(ngx, ngy);
  if (worldGrid[key] !== undefined) return worldGrid[key];

  // New map at this grid position
  const newId = worldMaps.length;
  const newMap = createForestMap(newId, ngx, ngy);
  worldMaps.push(newMap);
  worldGrid[key] = newId;
  return newId;
}

// ─── Game state ───────────────────────────────────────────────────────────────
let enemies = [];
let projectiles = [];
let particles = [];
let damageNumbers = [];
let keys = {};
let moveTimer = 0;
const MOVE_MS = 110;
let attackCooldown = 0, bowCooldown = 0, bombCooldown = 0;
let showMinimap = false;

let player = {
  x: EXIT_COL, y: EXIT_ROW,
  hp: 8, maxHp: 8, rupees: 0, level: 1, xp: 0, xpNext: 20,
  swordTimer: 0, swordDir: {x: 0, y: -1}, invincible: 0,
  weapon: 'sword', bowLevel: 1, swordLevel: 1, defeatedBoss: false
};

// Camera (top-left tile of viewport)
let camC = 0, camR = 0;

function clampCam() {
  const halfVC = PW / TILE_PX / 2;
  const halfVR = PH / TILE_PX / 2;
  const maxC = Math.max(0, MCOLS - PW / TILE_PX);
  const maxR = Math.max(0, MROWS - PH / TILE_PX);
  camC = Math.max(0, Math.min(maxC, player.x - halfVC + 0.5));
  camR = Math.max(0, Math.min(maxR, player.y - halfVR + 0.5));
}

function currentMap() { return worldMaps[currentMapId]; }
function mapData() { return currentMap().map; }

function isSolidAt(c, r) { return isSolid(mapData(), c, r); }

// ─── Fog of war ───────────────────────────────────────────────────────────────
// Per-map fog: a Uint8Array of (MCOLS * MROWS) bits (0=hidden,1=revealed)
function ensureFog(mapObj) {
  if (!mapObj.fog) {
    mapObj.fog = new Uint8Array(MCOLS * MROWS);
  }
}
function revealAround(mapObj, cx, cy, radius) {
  ensureFog(mapObj);
  for (let dr = -radius; dr <= radius; dr++) {
    for (let dc = -radius; dc <= radius; dc++) {
      if (dc * dc + dr * dr <= radius * radius) {
        const r = cy + dr, c = cx + dc;
        if (r >= 0 && r < MROWS && c >= 0 && c < MCOLS)
          mapObj.fog[r * MCOLS + c] = 1;
      }
    }
  }
  minimapDirty = true;
}
function isFoggy(mapObj, c, r) {
  if (!mapObj.fog) return true;
  return mapObj.fog[r * MCOLS + c] === 0;
}

// ─── Enemy spawning ───────────────────────────────────────────────────────────
function saveEnemyStateToMap(mapId) {
  if (worldMaps[mapId]) {
    worldMaps[mapId].savedEnemies = enemies.map(e => ({...e}));
  }
}

function spawnEnemiesForMap(mid) {
  const rm = worldMaps[mid];
  // If we've been here before and enemies have a saved state, restore it
  if (rm.savedEnemies) {
    enemies = rm.savedEnemies.map(e => ({...e}));
  } else {
    enemies = rm.enemyDefs.map((def, i) => {
      const base = DND_ENEMIES[def.type] || DND_ENEMIES.goblin;
      return {
        id: i, type: def.type, x: def.x, y: def.y,
        hp: base.hp, maxHp: base.hp,
        spd: base.spd, dmg: base.dmg, xp: base.xp,
        color: base.color, size: base.size || 1,
        name: base.name, ranged: base.ranged || false,
        boss: base.boss || false,
        timer: Math.random() * base.spd,
        dead: false, shootTimer: Math.random() * 1500 + 500
      };
    });
  }
  projectiles = [];
  particles = [];
}

// ─── Messages ─────────────────────────────────────────────────────────────────
function showMsg(t, dur = 2500) {
  const el = document.getElementById('msg-bar');
  el.textContent = t;
  if (dur > 0) setTimeout(() => { if (el.textContent === t) el.textContent = ''; }, dur);
}

// ─── XP / leveling ────────────────────────────────────────────────────────────
function gainXP(amt) {
  player.xp += amt;
  while (player.xp >= player.xpNext) {
    player.xp -= player.xpNext;
    player.level++;
    player.xpNext = Math.floor(player.xpNext * 1.6);
    player.maxHp += 2;
    player.hp = player.maxHp; // full heal on level up
    player.swordLevel++;
    showMsg(`⬆️ Level Up! Level ${player.level}! Max HP +2 — fully healed!`, 3000);
  }
}

// ─── HUD update ───────────────────────────────────────────────────────────────
function updateHUD() {
  let h = '';
  for (let i = 0; i < player.maxHp; i += 2) {
    if (i + 1 < player.hp) h += '❤️';
    else if (i < player.hp) h += '💛';
    else h += '🖤';
  }
  document.getElementById('hearts').textContent = h;
  document.getElementById('rupees').textContent = player.rupees;
  document.getElementById('level').textContent = player.level;
  document.getElementById('xp').textContent = player.xp;
  document.getElementById('xpnext').textContent = player.xpNext;
  document.getElementById('roomName').textContent = currentMap().name;
  document.getElementById('mapcount').textContent = `${mapsVisited + 1}`;
  ['sword', 'bow', 'bomb'].forEach(w => {
    document.getElementById('ws-' + w).className = 'weapon-slot' + (player.weapon === w ? ' weapon-active' : '');
  });
}

// ─── Particles ────────────────────────────────────────────────────────────────
function spawnParticle(wx, wy, color, n = 6, size = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 3;
    particles.push({x: wx, y: wy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 25 + Math.random() * 20, color, size: size * (0.5 + Math.random())});
  }
}
function screenPX(tx, ty) {
  return {
    x: (tx - camC + 0.5) * TILE_PX,
    y: (ty - camR + 0.5) * TILE_PX
  };
}

// ─── Kill enemy ───────────────────────────────────────────────────────────────
function killEnemy(e) {
  e.dead = true;
  const sp = screenPX(e.x, e.y);
  spawnParticle(sp.x, sp.y, e.color, 14, 5);
  spawnParticle(sp.x, sp.y, '#ffcc00', 6, 3);
  player.rupees += Math.floor(e.maxHp * 0.1) + 1;
  gainXP(e.xp);
  if (e.boss) { player.defeatedBoss = true; showMsg('🏆 THE FOREST LICH IS DEFEATED! You found your way home! 🏆', 0); }
  else showMsg(`⚔️ ${e.name} defeated! +${e.xp} XP`, 1500);
}

// ─── Respawn ──────────────────────────────────────────────────────────────────
function respawn() {
  player.hp = player.maxHp;
  currentMapId = 0;
  player.x = EXIT_COL; player.y = Math.floor(MROWS / 2);
  player.rupees = Math.max(0, player.rupees - 10);
  clampCam();
  spawnEnemiesForMap(0);
  showMsg('💀 Defeated! Returned to start (-10 rupees)', 3000);
}

let transitionCooldown = 0;

// ─── Room transition ──────────────────────────────────────────────────────────
function tryTransition() {
  if (transitionCooldown > 0) return;
  // Trigger when player steps onto the actual border tiles (which are open PATH via cutExits)
  let dir = null;
  if (player.x === 0)               dir = 'left';
  else if (player.x === MCOLS - 1)  dir = 'right';
  else if (player.y === 0)          dir = 'up';
  else if (player.y === MROWS - 1)  dir = 'down';

  if (!dir) return;

  // Save current enemy state before leaving
  saveEnemyStateToMap(currentMapId);

  const nextId = getOrCreateNeighbor(dir);
  if (nextId == null) return;

  currentMapId = nextId;
  const nm = worldMaps[nextId];

  if (!nm.visited) {
    nm.visited = true;
    mapsVisited++;
    mapSequence.push(nextId);
  }
  spawnEnemiesForMap(nextId);

  // Place player just inside the opposite edge, preserving lateral position
  if (dir === 'left')        { player.x = MCOLS - 2; /* keep player.y */ }
  else if (dir === 'right')  { player.x = 1;         /* keep player.y */ }
  else if (dir === 'up')     { player.y = MROWS - 2; /* keep player.x */ }
  else                       { player.y = 1;          /* keep player.x */ }

  // Nudge out of solid: try the original position first, then lateral offsets
  const map = mapData();
  if (isSolid(map, player.x, player.y)) {
    const lateral = (dir === 'left' || dir === 'right');
    let placed = false;
    for (let d = 1; d <= 5 && !placed; d++) {
      for (const sign of [1, -1]) {
        const ty = lateral ? player.y + d * sign : player.y;
        const tx = lateral ? player.x : player.x + d * sign;
        if (tx >= 0 && tx < MCOLS && ty >= 0 && ty < MROWS && !isSolid(map, tx, ty)) {
          player.x = tx; player.y = ty; placed = true; break;
        }
      }
    }
  }

  transitionCooldown = 400;
  minimapDirty = true;
  clampCam();
  revealAround(nm, player.x, player.y, 12);
  showMsg(`🌲 ${nm.name}`, 2500);
}

// ─── Update ───────────────────────────────────────────────────────────────────
function update(dt) {
  if (player.invincible > 0) player.invincible -= dt;
  if (attackCooldown > 0) attackCooldown -= dt;
  if (bowCooldown > 0) bowCooldown -= dt;
  if (bombCooldown > 0) bombCooldown -= dt;
  if (transitionCooldown > 0) transitionCooldown -= dt;
  moveTimer += dt;

  const map = mapData();

  if (keys['1']) player.weapon = 'sword';
  if (keys['2']) player.weapon = 'bow';
  if (keys['3']) player.weapon = 'bomb';

  let mx = 0, my = 0;
  if (keys['ArrowLeft']  || keys['a'] || keys['A']) mx = -1;
  else if (keys['ArrowRight'] || keys['d'] || keys['D']) mx = 1;
  else if (keys['ArrowUp']    || keys['w'] || keys['W']) my = -1;
  else if (keys['ArrowDown']  || keys['s'] || keys['S']) my = 1;

  if ((mx || my) && moveTimer >= MOVE_MS) {
    moveTimer = 0;
    if (mx) player.swordDir = {x: mx, y: 0};
    if (my) player.swordDir = {x: 0, y: my};
    const nx = player.x + mx, ny = player.y + my;
    // Allow movement onto border tiles (exits) — clamp to valid range
    const bnx = Math.max(0, Math.min(MCOLS - 1, nx));
    const bny = Math.max(0, Math.min(MROWS - 1, ny));
    if (!isSolid(map, bnx, bny)) {
      // Chest pickup
      if (map[bny][bnx] === T.CHEST && !currentMap().openedChests.has(`${bnx},${bny}`)) {
        currentMap().openedChests.add(`${bnx},${bny}`);
        const roll = Math.random();
        let reward;
        if (roll < 0.3) { player.rupees += 10 + Math.floor(Math.random() * 25); reward = '💎 Found Rupees!'; }
        else if (roll < 0.55) { player.hp = player.maxHp; reward = '❤️ Full Hearts Restored!'; }
        else if (roll < 0.75) { player.bowLevel++; reward = `🏹 Bow Lv${player.bowLevel}!`; }
        else if (roll < 0.9) { gainXP(300); reward = '📜 Ancient Scroll! +300 XP'; }
        else { player.maxHp += 2; player.hp = player.maxHp; reward = '💚 Max HP +2 & Healed!'; }
        showMsg(reward, 3000);
        const sp = screenPX(bnx, bny);
        spawnParticle(sp.x, sp.y, '#ffcc00', 12, 4);
      }
      if (map[bny][bnx] === T.SHRINE && !currentMap().openedChests.has(`shrine_${bnx},${bny}`)) {
        currentMap().openedChests.add(`shrine_${bnx},${bny}`);
        player.hp = player.maxHp;
        showMsg('🙏 Ancient Shrine — HP fully restored!', 2500);
        const sp = screenPX(bnx, bny);
        spawnParticle(sp.x, sp.y, '#aaffaa', 16, 4);
      }
      player.x = bnx; player.y = bny;
    }
    clampCam();
    revealAround(currentMap(), player.x, player.y, 12);
    tryTransition();
  }

  // Attacks
  const actZ = keys[' '] || keys['z'] || keys['Z'];
  const actX = keys['x'] || keys['X'];
  const actC = keys['c'] || keys['C'];

  if (actZ && attackCooldown <= 0) {
    attackCooldown = 280;
    player.swordTimer = 180;
    player.weapon = 'sword';
    const tx = player.x + player.swordDir.x, ty = player.y + player.swordDir.y;
    const sp = screenPX(tx, ty);
    spawnParticle(sp.x, sp.y, '#ffee88', 4, 3);
    enemies.filter(e => !e.dead).forEach(e => {
      if (Math.abs(e.x - tx) <= 1 && Math.abs(e.y - ty) <= 1) {
        const dmg = player.swordLevel + Math.floor(Math.random() * 3);
        e.hp -= dmg;
        const esp = screenPX(e.x, e.y);
        damageNumbers.push({x: esp.x, y: esp.y, val: dmg, color: '#ff4444', life: 40, vy: -1.2});
        if (e.hp <= 0) killEnemy(e);
      }
    });
  }
  if (actX && bowCooldown <= 0) {
    bowCooldown = 350;
    player.weapon = 'bow';
    projectiles.push({
      tx: player.x + 0.5, ty: player.y + 0.5,
      vx: player.swordDir.x * 0.35, vy: player.swordDir.y * 0.35,
      dmg: player.bowLevel * 2 + 1, type: 'arrow', life: 120, color: '#ddaa44'
    });
  }
  if (actC && bombCooldown <= 0) {
    bombCooldown = 1200;
    player.weapon = 'bomb';
    const bx = player.x + player.swordDir.x * 3, by = player.y + player.swordDir.y * 3;
    projectiles.push({tx: bx + 0.5, ty: by + 0.5, vx: 0, vy: 0, dmg: 7 + player.swordLevel, type: 'bomb', life: 50, color: '#333'});
  }

  // Enemy ranged fire
  enemies.filter(e => !e.dead && e.ranged).forEach(e => {
    e.shootTimer -= dt;
    if (e.shootTimer <= 0) {
      e.shootTimer = 1800 + Math.random() * 1200;
      const dx = player.x - e.x, dy = player.y - e.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 18) {
        projectiles.push({
          tx: e.x + 0.5, ty: e.y + 0.5,
          vx: (dx / dist) * 0.25, vy: (dy / dist) * 0.25,
          dmg: e.dmg, type: 'enemy', life: 130, color: e.color
        });
      }
    }
  });

  // Update projectiles (tile-float coords)
  projectiles.forEach(p => {
    p.life--;
    if (p.type === 'bomb') {
      if (p.life <= 0) {
        const bsp = screenPX(p.tx, p.ty);
        spawnParticle(bsp.x, bsp.y, '#ff8800', 20, 6);
        enemies.filter(e => !e.dead).forEach(e => {
          const dx = e.x - p.tx, dy = e.y - p.ty;
          if (Math.abs(dx) < 4 && Math.abs(dy) < 4) {
            e.hp -= p.dmg;
            const esp = screenPX(e.x, e.y);
            damageNumbers.push({x: esp.x, y: esp.y, val: p.dmg, color: '#ff8800', life: 40, vy: -1.2});
            if (e.hp <= 0) killEnemy(e);
          }
        });
        const btc = Math.round(p.tx), btr = Math.round(p.ty);
        for (let dr = -3; dr <= 3; dr++) for (let dc = -3; dc <= 3; dc++) {
          const tr = btr + dr, tc = btc + dc;
          if (tr > 0 && tr < MROWS - 1 && tc > 0 && tc < MCOLS - 1 && map[tr][tc] === T.ROCK)
            map[tr][tc] = T.GRASS;
        }
        p.life = -999;
      }
      return;
    }
    p.tx += p.vx; p.ty += p.vy;
    const pc = Math.floor(p.tx), pr = Math.floor(p.ty);
    if (isSolid(map, pc, pr)) { p.life = -999; return; }
    if (p.type === 'arrow') {
      enemies.filter(e => !e.dead).forEach(e => {
        const dx = e.x - p.tx, dy = e.y - p.ty;
        if (Math.abs(dx) < 0.9 && Math.abs(dy) < 0.9) {
          e.hp -= p.dmg;
          const esp = screenPX(e.x, e.y);
          damageNumbers.push({x: esp.x, y: esp.y, val: p.dmg, color: '#ddaa44', life: 40, vy: -1.2});
          spawnParticle(esp.x, esp.y, '#ddaa44', 4, 2);
          if (e.hp <= 0) killEnemy(e);
          p.life = -999;
        }
      });
    } else if (p.type === 'enemy') {
      const dx = player.x - p.tx, dy = player.y - p.ty;
      if (Math.abs(dx) < 0.8 && Math.abs(dy) < 0.8 && player.invincible <= 0) {
        player.hp -= 1; player.invincible = 800;
        const psp = screenPX(player.x, player.y);
        spawnParticle(psp.x, psp.y, '#ff2222', 6, 3);
        p.life = -999;
        if (player.hp <= 0) respawn();
      }
    }
  });
  projectiles = projectiles.filter(p => p.life > 0);

  // Enemy movement
  enemies.filter(e => !e.dead).forEach(e => {
    e.timer -= dt;
    if (e.timer <= 0) {
      e.timer = e.spd;
      const dx = player.x - e.x, dy = player.y - e.y;
      const dist = Math.abs(dx) + Math.abs(dy);
      let emx = 0, emy = 0;
      if (e.ranged) {
        if (dist < 5)      { emx = -Math.sign(dx); emy = 0; if (!emx) emy = -Math.sign(dy); }
        else if (dist > 9) { emx = Math.sign(dx); emy = 0; if (Math.abs(dy) > Math.abs(dx)) { emx = 0; emy = Math.sign(dy); } }
        else               { const d = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}][Math.floor(Math.random()*4)]; emx=d.x; emy=d.y; }
      } else {
        if (dist < 8)      { emx = Math.sign(dx); emy = 0; if (Math.abs(dy) > Math.abs(dx)) { emx = 0; emy = Math.sign(dy); } }
        else               { const d = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}][Math.floor(Math.random()*4)]; emx=d.x; emy=d.y; }
      }
      const nx = e.x + emx, ny = e.y + emy;
      if (!isSolid(map, nx, ny) && !enemies.some(o => !o.dead && o !== e && o.x === nx && o.y === ny)) {
        e.x = nx; e.y = ny;
      }
      const mdx = player.x - e.x, mdy = player.y - e.y;
      if (Math.abs(mdx) <= 1 && Math.abs(mdy) <= 1 && player.invincible <= 0 && !e.ranged) {
        player.hp -= 1; player.invincible = 900;
        const psp = screenPX(player.x, player.y);
        spawnParticle(psp.x, psp.y, '#ff2222', 5, 3);
        if (player.hp <= 0) respawn();
      }
    }
  });

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life--; });
  particles = particles.filter(p => p.life > 0);
  damageNumbers.forEach(d => { d.y += d.vy; d.life--; });
  damageNumbers = damageNumbers.filter(d => d.life > 0);

  updateHUD();
}

// ─── Rendering ────────────────────────────────────────────────────────────────
const TILE_COLORS = {
  [T.GRASS]: '#3a7a3a', [T.TREE]: '#1a4a1a', [T.WATER]: '#2255aa',
  [T.PATH]: '#8a7050', [T.WALL]: '#484848', [T.FLOOR]: '#9a7550',
  [T.CHEST]: '#7a4400', [T.DOOR]: '#663399', [T.ROCK]: '#777',
  [T.SAND]: '#d4b070', [T.FLOWER]: '#4a8a3a', [T.DUNGEON_DOOR]: '#220033',
  [T.DEEP_WATER]: '#112266', [T.LAVA]: '#cc2200', [T.BRIDGE]: '#885522',
  [T.PILLAR]: '#555', [T.TORCH]: '#663300', [T.STATUE]: '#888',
  [T.SHRINE]: '#225522', [T.MUSHROOM]: '#3a7a3a', [T.FERN]: '#3a7a3a',
};

function drawTile(col, row, t, sx, sy, s) {
  const x = sx, y = sy;
  ctx.fillStyle = TILE_COLORS[t] || '#111';
  ctx.fillRect(x, y, s, s);

  switch (t) {
    case T.GRASS:
      ctx.fillStyle = '#3d7530'; ctx.fillRect(x+2,y+3,4,2); ctx.fillRect(x+s-6,y+s-5,4,2);
      ctx.fillStyle = '#5a9a4a'; ctx.fillRect(x+s/2,y+s/2-2,3,3); break;
    case T.TREE: {
      ctx.fillStyle = '#0d2a0d'; ctx.fillRect(x,y,s,s);
      ctx.fillStyle = '#2d6a1a'; ctx.beginPath(); ctx.arc(x+s/2,y+s/2+2,s*0.38,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#3a8a22'; ctx.beginPath(); ctx.arc(x+s/2-2,y+s/2-2,s*0.26,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#4aaa2a'; ctx.beginPath(); ctx.arc(x+s/2+1,y+s/2-4,s*0.18,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#5a6a40'; ctx.fillRect(x+s/2-2,y+s-4,4,4); break; }
    case T.WATER: {
      const w = Math.sin(Date.now()/600+col*0.5+row*0.3);
      ctx.fillStyle = '#3366cc'; ctx.fillRect(x+2,y+s*0.3+w*2,s*0.4,3);
      ctx.fillStyle = '#4488ee'; ctx.fillRect(x+s*0.5,y+s*0.6-w*2,s*0.35,2); break; }
    case T.DEEP_WATER:
      ctx.fillStyle = '#1a3388'; ctx.fillRect(x+2,y+s*0.4,s-4,3); break;
    case T.PATH:
      ctx.fillStyle = '#a08860'; ctx.fillRect(x+1,y+1,s-2,s-2);
      ctx.fillStyle = '#b09870'; ctx.fillRect(x+3,y+3,s-6,s-6); break;
    case T.WALL:
      ctx.fillStyle = '#555'; ctx.fillRect(x,y,s,s);
      ctx.fillStyle = '#333'; ctx.fillRect(x,y,s,2); ctx.fillRect(x,y,2,s);
      ctx.fillStyle = '#666'; ctx.fillRect(x+s-2,y,2,s); ctx.fillRect(x,y+s-2,s,2); break;
    case T.FLOOR:
      ctx.fillStyle = '#8a6540'; ctx.fillRect(x,y,s,2); ctx.fillRect(x,y,2,s);
      ctx.fillStyle = '#aa8560'; ctx.fillRect(x+s-2,y,2,s); break;
    case T.CHEST: {
      const opened = currentMap().openedChests.has(`${col},${row}`);
      if (!opened) {
        ctx.fillStyle = '#cc7700'; ctx.fillRect(x+3,y+s*0.3,s-6,s*0.6);
        ctx.fillStyle = '#ffaa00'; ctx.fillRect(x+3,y+s*0.22,s-6,s*0.2);
        ctx.fillStyle = '#ffdd00'; ctx.fillRect(x+s/2-2,y+s*0.3,4,5);
      } else {
        ctx.fillStyle = '#553300'; ctx.fillRect(x+3,y+s*0.45,s-6,s*0.4);
        ctx.fillStyle = '#774400'; ctx.fillRect(x+3,y+s*0.38,s-6,s*0.1);
      } break; }
    case T.DOOR:
      ctx.fillStyle = '#884acc'; ctx.fillRect(x+4,y+2,s-8,s-2);
      ctx.fillStyle = '#cc88ff'; ctx.fillRect(x+s/2-2,y+s/2-4,4,8); break;
    case T.ROCK:
      ctx.fillStyle = '#999'; ctx.beginPath(); ctx.arc(x+s/2,y+s/2,s*0.38,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#aaa'; ctx.beginPath(); ctx.arc(x+s/2-3,y+s/2-3,s*0.2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#666'; ctx.beginPath(); ctx.arc(x+s/2+4,y+s/2+3,s*0.12,0,Math.PI*2); ctx.fill(); break;
    case T.FLOWER:
      ctx.fillStyle = '#4a8a3a'; ctx.fillRect(x,y,s,s);
      ctx.fillStyle = '#ff88aa'; ctx.beginPath(); ctx.arc(x+s/2,y+s/2,5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffff00'; ctx.beginPath(); ctx.arc(x+s/2,y+s/2,2,0,Math.PI*2); ctx.fill(); break;
    case T.DUNGEON_DOOR: {
      ctx.fillStyle = '#220033'; ctx.fillRect(x,y,s,s);
      const pulse = Math.sin(Date.now()/300)*2;
      ctx.fillStyle = '#440066'; ctx.beginPath(); ctx.arc(x+s/2,y+s/2,s*0.38+pulse,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#cc44ff'; ctx.beginPath(); ctx.arc(x+s/2,y+s/2,s*0.1,0,Math.PI*2); ctx.fill(); break; }
    case T.LAVA: {
      const lw = Math.sin(Date.now()/400+col+row)*2;
      ctx.fillStyle = '#ff5500'; ctx.fillRect(x+2,y+s*0.3+lw,s-4,5);
      ctx.fillStyle = '#ff8800'; ctx.fillRect(x+s*0.3,y+s*0.6-lw,s*0.4,3); break; }
    case T.BRIDGE:
      ctx.fillStyle = '#aa7733'; ctx.fillRect(x+2,y+2,s-4,s-4);
      ctx.fillStyle = '#cc9944'; ctx.fillRect(x+3,y+s/2-1,s-6,2);
      ctx.fillStyle = '#884411'; ctx.fillRect(x+2,y+2,2,s-4); ctx.fillRect(x+s-4,y+2,2,s-4); break;
    case T.PILLAR:
      ctx.fillStyle = '#888'; ctx.beginPath(); ctx.arc(x+s/2,y+s/2,s*0.38,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#aaa'; ctx.beginPath(); ctx.arc(x+s/2-3,y+s/2-3,s*0.15,0,Math.PI*2); ctx.fill(); break;
    case T.TORCH: {
      ctx.fillStyle = '#884400'; ctx.fillRect(x+s/2-2,y+6,4,8);
      const tf = Math.sin(Date.now()/150+col+row*2);
      ctx.fillStyle = '#ff8800'; ctx.beginPath(); ctx.arc(x+s/2,y+4+tf,4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(x+s/2,y+3+tf*0.5,2,0,Math.PI*2); ctx.fill(); break; }
    case T.STATUE:
      ctx.fillStyle = '#aaa'; ctx.fillRect(x+4,y+2,s-8,s-4);
      ctx.fillStyle = '#999'; ctx.beginPath(); ctx.arc(x+s/2,y+4,5,0,Math.PI*2); ctx.fill(); break;
    case T.SHRINE:
      ctx.fillStyle = '#336633'; ctx.fillRect(x,y,s,s);
      ctx.fillStyle = '#55aa55'; ctx.fillRect(x+3,y+3,s-6,s-6);
      ctx.fillStyle = '#aaffaa'; ctx.beginPath(); ctx.arc(x+s/2,y+s/2,s*0.22,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x+s/2-1,y+2,2,s-4); ctx.fillRect(x+2,y+s/2-1,s-4,2); break;
    case T.MUSHROOM:
      ctx.fillStyle = '#3a7a3a'; ctx.fillRect(x,y,s,s);
      ctx.fillStyle = '#cc3300'; ctx.beginPath(); ctx.arc(x+s/2,y+s*0.4,s*0.28,Math.PI,0); ctx.fill();
      ctx.fillStyle = '#aa2200'; ctx.beginPath(); ctx.arc(x+s/2,y+s*0.42,s*0.28,0,Math.PI); ctx.fill();
      ctx.fillStyle = '#ffaaaa'; ctx.fillRect(x+s/2-1,y+s*0.3,2,2); ctx.fillRect(x+s/2+3,y+s*0.32,2,2);
      ctx.fillStyle = '#ddddaa'; ctx.fillRect(x+s/2-2,y+s*0.42,4,s*0.3); break;
    case T.FERN:
      ctx.fillStyle = '#3a7a3a'; ctx.fillRect(x,y,s,s);
      ctx.save();
      ctx.strokeStyle = '#44aa44'; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const fa = -Math.PI/4 + i * Math.PI/4;
        ctx.beginPath(); ctx.moveTo(x+s/2,y+s*0.7);
        ctx.lineTo(x+s/2+Math.cos(fa)*s*0.42,y+s/2+Math.sin(fa)*s*0.42);
        ctx.stroke();
      }
      ctx.restore(); break;
  }
}

function drawPlayer(ts) {
  const sx = (player.x - camC) * ts, sy = (player.y - camR) * ts, s = ts;
  const blink = player.invincible > 0 && Math.floor(Date.now()/80) % 2 === 0;
  if (blink) return;
  ctx.save();
  const sd = player.swordDir;
  // Body
  ctx.fillStyle = '#2255cc'; ctx.fillRect(sx+s*0.2,sy+s*0.42,s*0.6,s*0.5);
  ctx.fillStyle = '#cc2222';
  if (sd.y < 0) ctx.fillRect(sx+s*0.2,sy+s*0.42,s*0.6,s*0.2);
  else if (sd.y > 0) ctx.fillRect(sx+s*0.2,sy+s*0.78,s*0.6,s*0.14);
  // Head
  ctx.fillStyle = '#f8d070'; ctx.beginPath(); ctx.arc(sx+s/2,sy+s*0.28,s*0.22,0,Math.PI*2); ctx.fill();
  // Hat
  ctx.fillStyle = '#44aa44'; ctx.fillRect(sx+s*0.12,sy+s*0.04,s*0.76,s*0.16);
  ctx.fillStyle = '#55cc55'; ctx.fillRect(sx+s*0.22,sy,s*0.56,s*0.08);
  // Eyes
  ctx.fillStyle = '#000'; ctx.fillRect(sx+s/2-s*0.12,sy+s*0.22,s*0.07,s*0.07); ctx.fillRect(sx+s/2+s*0.05,sy+s*0.22,s*0.07,s*0.07);
  // Shield
  ctx.fillStyle = '#cc2222'; ctx.fillRect(sx+s*0.04,sy+s*0.44,s*0.18,s*0.28);
  ctx.fillStyle = '#ffcc00'; ctx.fillRect(sx+s*0.06,sy+s*0.5,s*0.14,s*0.16);
  // Sword
  if (player.swordTimer > 0) {
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx+s/2,sy+s/2);
    ctx.lineTo(sx+s/2+sd.x*s*1.2,sy+s/2+sd.y*s*1.2); ctx.stroke();
    ctx.fillStyle = '#aaa'; ctx.fillRect(sx+s/2+sd.x*s*1.1-3,sy+s/2+sd.y*s*1.1-3,6,6);
  }
  ctx.restore();
}

function drawEnemy(e, ts) {
  const sx = (e.x - camC) * ts, sy = (e.y - camR) * ts, s = ts * e.size;
  const ox = (ts - s)/2, oy = (ts - s)/2;
  const px = sx + ox, py = sy + oy;
  ctx.save();
  switch (e.type) {
    case 'goblin':
      ctx.fillStyle = '#336622'; ctx.fillRect(px+s*0.15,py+s*0.35,s*0.7,s*0.55);
      ctx.fillStyle = '#558844'; ctx.beginPath(); ctx.arc(px+s/2,py+s*0.3,s*0.25,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#cc2200'; ctx.fillRect(px+s*0.3,py,s*0.18,s*0.2); ctx.fillRect(px+s*0.52,py,s*0.18,s*0.2);
      ctx.fillStyle = '#ff2200'; ctx.fillRect(px+s*0.35,py+s*0.26,s*0.06,s*0.06); ctx.fillRect(px+s*0.55,py+s*0.26,s*0.06,s*0.06); break;
    case 'wolf':
      ctx.fillStyle = '#775533'; ctx.fillRect(px+s*0.1,py+s*0.3,s*0.8,s*0.5);
      ctx.fillStyle = '#886644'; ctx.beginPath(); ctx.arc(px+s*0.75,py+s*0.35,s*0.25,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#775533'; [0.1,0.35,0.55,0.75].forEach(cx2 => ctx.fillRect(px+s*cx2,py+s*0.75,s*0.15,s*0.22));
      ctx.fillStyle = '#aa2200'; ctx.fillRect(px+s*0.82,py+s*0.32,s*0.06,s*0.06); break;
    case 'skeleton':
      ctx.fillStyle = '#ccccaa'; ctx.fillRect(px+s*0.3,py+s*0.4,s*0.4,s*0.5);
      ctx.fillStyle = '#ddddbb'; ctx.beginPath(); ctx.arc(px+s/2,py+s*0.26,s*0.24,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000'; ctx.fillRect(px+s*0.38,py+s*0.22,s*0.1,s*0.1); ctx.fillRect(px+s*0.52,py+s*0.22,s*0.1,s*0.1);
      ctx.fillStyle = '#ccccaa'; ctx.fillRect(px+s*0.1,py+s*0.42,s*0.18,s*0.06); ctx.fillRect(px+s*0.72,py+s*0.42,s*0.18,s*0.06); break;
    case 'treant':
      ctx.fillStyle = '#2a3a1a'; ctx.fillRect(px,py,s,s);
      ctx.fillStyle = '#4a5a2a'; ctx.beginPath(); ctx.arc(px+s/2,py+s*0.4,s*0.42,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#3a4a1a'; ctx.fillRect(px+s*0.35,py+s*0.7,s*0.3,s*0.3);
      ctx.fillStyle = '#6a8a2a'; ctx.fillRect(px+s*0.1,py+s*0.2,s*0.18,s*0.4); ctx.fillRect(px+s*0.72,py+s*0.2,s*0.18,s*0.4);
      ctx.fillStyle = '#ff4400'; ctx.fillRect(px+s*0.38,py+s*0.32,s*0.08,s*0.08); ctx.fillRect(px+s*0.54,py+s*0.32,s*0.08,s*0.08); break;
    case 'owlbear':
      ctx.fillStyle = '#5a4010'; ctx.fillRect(px+s*0.1,py+s*0.3,s*0.8,s*0.6);
      ctx.fillStyle = '#8a6622'; ctx.beginPath(); ctx.arc(px+s/2,py+s*0.28,s*0.28,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ccaa44'; ctx.fillRect(px+s*0.36,py+s*0.16,s*0.12,s*0.14); ctx.fillRect(px+s*0.52,py+s*0.16,s*0.12,s*0.14);
      ctx.fillStyle = '#ffcc00'; ctx.fillRect(px+s*0.4,py+s*0.24,s*0.08,s*0.08); ctx.fillRect(px+s*0.52,py+s*0.24,s*0.08,s*0.08); break;
    case 'pixie':
      ctx.fillStyle = '#88aaff'; ctx.beginPath(); ctx.arc(px+s/2,py+s/2,s*0.22,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(180,200,255,0.5)'; ctx.fillRect(px+s*0.1,py+s*0.3,s*0.35,s*0.18); ctx.fillRect(px+s*0.55,py+s*0.3,s*0.35,s*0.18);
      ctx.fillStyle = '#fff'; ctx.fillRect(px+s*0.4,py+s*0.42,s*0.06,s*0.06); ctx.fillRect(px+s*0.54,py+s*0.42,s*0.06,s*0.06); break;
    case 'displacer':
      ctx.fillStyle = '#3a2a55'; ctx.fillRect(px+s*0.1,py+s*0.3,s*0.8,s*0.55);
      ctx.fillStyle = '#554488'; ctx.beginPath(); ctx.arc(px+s*0.3,py+s*0.35,s*0.22,0,Math.PI*2); ctx.fill();
      ctx.save();
      ctx.strokeStyle = '#7766aa'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px+s*0.2,py+s*0.4); ctx.lineTo(px+s*0.05,py+s*0.15); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px+s*0.8,py+s*0.4); ctx.lineTo(px+s*0.95,py+s*0.15); ctx.stroke();
      ctx.restore(); break;
    case 'beholder':
      ctx.fillStyle = '#334422'; ctx.beginPath(); ctx.arc(px+s/2,py+s/2,s*0.42,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#446633'; ctx.beginPath(); ctx.arc(px+s/2,py+s/2,s*0.36,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(px+s/2,py+s*0.42,s*0.18,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(px+s/2,py+s*0.42,s*0.08,0,Math.PI*2); ctx.fill();
      for (let i = 0; i < 6; i++) { const a = i*Math.PI/3-Math.PI/6; ctx.fillStyle='#88aa44'; ctx.fillRect(px+s/2+Math.cos(a)*s*0.38-2,py+s/2+Math.sin(a)*s*0.38-2,4,4); } break;
    case 'lich': case 'lich_boss':
      ctx.fillStyle = e.color; ctx.fillRect(px+s*0.2,py+s*0.35,s*0.6,s*0.55);
      ctx.fillStyle = '#220022'; ctx.beginPath(); ctx.arc(px+s/2,py+s*0.28,s*0.26,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = e.color; ctx.beginPath(); ctx.arc(px+s/2,py+s*0.28,s*0.22,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#aa44ff'; ctx.fillRect(px+s*0.38,py+s*0.22,s*0.08,s*0.1); ctx.fillRect(px+s*0.54,py+s*0.22,s*0.08,s*0.1);
      if (e.boss) { ctx.strokeStyle='#aa44ff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(px+s/2,py+s/2,s*0.55,0,Math.PI*2); ctx.stroke(); } break;
    default: {
      ctx.fillStyle = e.color; ctx.fillRect(px+s*0.15,py+s*0.3,s*0.7,s*0.6);
      ctx.fillStyle = e.color; ctx.beginPath(); ctx.arc(px+s/2,py+s*0.28,s*0.24,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ff2200'; ctx.fillRect(px+s*0.35,py+s*0.22,s*0.08,s*0.1); ctx.fillRect(px+s*0.55,py+s*0.22,s*0.08,s*0.1); }
  }
  // HP bar
  const barW = ts * e.size * 0.9;
  const barX = sx + ox + s*0.05, barY = sy + oy - 6;
  ctx.fillStyle = '#222'; ctx.fillRect(barX, barY, barW, 4);
  const pct = Math.max(0, e.hp / e.maxHp);
  ctx.fillStyle = pct > 0.5 ? '#44cc44' : pct > 0.25 ? '#cccc00' : '#cc2222';
  ctx.fillRect(barX, barY, barW * pct, 4);
  if (e.boss || e.hp > 80) {
    ctx.font = `bold 10px monospace`; ctx.fillStyle = '#ffcc00'; ctx.textAlign = 'center';
    ctx.fillText(e.name, sx + ts/2, barY - 2); ctx.textAlign = 'left';
  }
  ctx.restore();
}

function drawProjectile(p) {
  const sx = (p.tx - camC) * TILE_PX, sy = (p.ty - camR) * TILE_PX;
  ctx.save();
  if (p.type === 'arrow') {
    const len = TILE_PX * 0.4;
    const mag = Math.sqrt(p.vx*p.vx+p.vy*p.vy)||1;
    const nx = p.vx/mag, ny = p.vy/mag;
    ctx.strokeStyle = '#ddaa44'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx-nx*len,sy-ny*len); ctx.lineTo(sx+nx*len,sy+ny*len); ctx.stroke();
    ctx.fillStyle = '#8855aa'; ctx.beginPath(); ctx.arc(sx+nx*len,sy+ny*len,3,0,Math.PI*2); ctx.fill();
  } else if (p.type === 'bomb') {
    const br = TILE_PX * 0.22;
    ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(sx,sy,br,0,Math.PI*2); ctx.fill();
    if (Math.floor(Date.now()/100+p.life)%2===0) { ctx.fillStyle='#ff4400'; ctx.beginPath(); ctx.arc(sx,sy-br,br*0.5,0,Math.PI*2); ctx.fill(); }
  } else {
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(sx,sy,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,200,0.6)'; ctx.beginPath(); ctx.arc(sx,sy,3,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

let minimapDirty = true;
let minimapCanvases = {}; // keyed by mapId for per-map caching


function drawMinimap() {
  const scale = 1.2;
  const mw = Math.floor(MCOLS * scale), mh = Math.floor(MROWS * scale);
  const mx = PW - mw - 8, my = 8;

  let minimapCanvas = minimapCanvases[currentMapId];
  if (minimapDirty || !minimapCanvas ||
      minimapCanvas.width !== mw || minimapCanvas.height !== mh) {
    if (!minimapCanvas) { minimapCanvas = document.createElement('canvas'); minimapCanvases[currentMapId] = minimapCanvas; }
    minimapCanvas.width = mw; minimapCanvas.height = mh;
    const mc2 = minimapCanvas.getContext('2d');
    mc2.fillStyle = '#000';
    mc2.fillRect(0, 0, mw, mh);
    const mapObj = currentMap();
    for (let r = 0; r < MROWS; r++) {
      for (let c = 0; c < MCOLS; c++) {
        if (isFoggy(mapObj, c, r)) continue;
        const t = mapObj.map[r][c];
        mc2.fillStyle = TILE_COLORS[t] || '#111';
        mc2.fillRect(Math.floor(c*scale), Math.floor(r*scale), Math.ceil(scale), Math.ceil(scale));
      }
    }
    minimapDirty = false;
  }

  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(mx-2, my-2, mw+4, mh+4);
  ctx.drawImage(minimapCanvas, mx, my);

  // Player dot
  ctx.fillStyle = '#ffcc00';
  ctx.fillRect(mx + Math.floor(player.x*scale)-1, my + Math.floor(player.y*scale)-1, 3, 3);
  // Enemy dots
  enemies.filter(e=>!e.dead).forEach(e => {
    ctx.fillStyle = e.boss ? '#ff00ff' : '#ff4444';
    ctx.fillRect(mx + Math.floor(e.x*scale), my + Math.floor(e.y*scale), 2, 2);
  });
  // Exit arrows
  ctx.fillStyle = '#ffff00'; ctx.font = '8px monospace'; ctx.textAlign = 'left';
  ctx.fillText('▶', mx+mw-6, my+Math.floor(EXIT_ROW*scale)+4);
  ctx.fillText('◀', mx+1,    my+Math.floor(EXIT_ROW*scale)+4);
  ctx.textAlign = 'center';
  ctx.fillText('▲', mx+Math.floor(EXIT_COL*scale), my+6);
  ctx.fillText('▼', mx+Math.floor(EXIT_COL*scale), my+mh-1);
  ctx.restore();
}

function drawFog() {
  const mapObj = currentMap();
  if (!mapObj.fog) return;
  ctx.save();
  const startC = Math.floor(camC), startR = Math.floor(camR);
  const endC = Math.ceil(camC + PW / TILE_PX) + 1;
  const endR = Math.ceil(camR + PH / TILE_PX) + 1;
  for (let mr = startR; mr <= endR; mr++) {
    for (let mc = startC; mc <= endC; mc++) {
      if (mc < 0 || mc >= MCOLS || mr < 0 || mr >= MROWS) continue;
      if (!isFoggy(mapObj, mc, mr)) continue;
      const sx = (mc - camC) * TILE_PX, sy = (mr - camR) * TILE_PX;
      ctx.fillStyle = '#000';
      ctx.fillRect(Math.floor(sx), Math.floor(sy), Math.ceil(TILE_PX) + 1, Math.ceil(TILE_PX) + 1);
    }
  }
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, PW, PH);
  const ts = TILE_PX;
  const map = mapData();
  const mapObj = currentMap();

  const startC = Math.floor(camC), startR = Math.floor(camR);
  const endC = Math.ceil(camC + PW / TILE_PX) + 1;
  const endR = Math.ceil(camR + PH / TILE_PX) + 1;

  // Draw visible tiles
  for (let mr = startR; mr <= endR; mr++) {
    for (let mc = startC; mc <= endC; mc++) {
      const sx = Math.floor((mc - camC) * ts);
      const sy = Math.floor((mr - camR) * ts);
      const tw = Math.ceil(ts) + 1;
      if (mc < 0 || mc >= MCOLS || mr < 0 || mr >= MROWS) {
        ctx.fillStyle = '#050a05'; ctx.fillRect(sx, sy, tw, tw);
        continue;
      }
      drawTile(mc, mr, map[mr][mc], sx, sy, ts);
    }
  }

  // Fog of war
  drawFog();

  // Projectiles
  projectiles.forEach(p => drawProjectile(p));

  // Enemies (only if in revealed fog)
  enemies.filter(e => !e.dead).forEach(e => {
    if (!isFoggy(mapObj, e.x, e.y)) drawEnemy(e, ts);
  });

  // Player
  drawPlayer(ts);

  // Particles
  ctx.save();
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / 50);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  });
  ctx.restore();

  // Damage numbers
  ctx.save();
  damageNumbers.forEach(d => {
    ctx.globalAlpha = Math.max(0, d.life / 40);
    ctx.fillStyle = d.color;
    ctx.font = `bold ${Math.round(ts * 0.35)}px monospace`; ctx.textAlign = 'center';
    ctx.fillText(d.val, d.x, d.y);
  });
  ctx.textAlign = 'left';
  ctx.restore();

  // Exit arrows at screen edges
  ctx.save();
  const arrowSz = Math.round(ts * 0.8);
  ctx.fillStyle = 'rgba(255,255,0,0.7)'; ctx.font = `${arrowSz}px monospace`; ctx.textAlign = 'center';
  ctx.fillText('▶', PW - arrowSz * 0.7, PH / 2 + arrowSz * 0.35);
  ctx.fillText('◀', arrowSz * 0.7, PH / 2 + arrowSz * 0.35);
  ctx.fillText('▲', PW / 2, arrowSz * 0.9);
  ctx.fillText('▼', PW / 2, PH - arrowSz * 0.1);
  ctx.restore();

  if (showMinimap) drawMinimap();
}

// ─── Map tile serialization ───────────────────────────────────────────────────
// Encode a map (array of Uint8Array rows) to a compact base64 string
function encodeMap(mapArr) {
  const buf = new Uint8Array(MROWS * MCOLS);
  for (let r = 0; r < MROWS; r++) buf.set(mapArr[r], r * MCOLS);
  const chars = new Array(buf.length);
  for (let i = 0; i < buf.length; i++) chars[i] = String.fromCharCode(buf[i]);
  return btoa(chars.join(''));
}

function decodeMap(b64) {
  const bin = atob(b64);
  const mapArr = [];
  for (let r = 0; r < MROWS; r++) {
    const row = new Uint8Array(MCOLS);
    for (let c = 0; c < MCOLS; c++) row[c] = bin.charCodeAt(r * MCOLS + c);
    mapArr.push(row);
  }
  return mapArr;
}

// ─── Save / load — slot system ────────────────────────────────────────────────
const SAVE_KEY_PREFIX = 'hyrule_quest_slot_';
const MAX_SLOTS = 6;
let modalMode = null; // 'save' | 'load'
let pendingSlot = null;

function getSaveIndex() {
  const raw = localStorage.getItem('hyrule_quest_index');
  return raw ? JSON.parse(raw) : {};
}
function setSaveIndex(idx) {
  localStorage.setItem('hyrule_quest_index', JSON.stringify(idx));
}

function buildSaveData() {
  saveEnemyStateToMap(currentMapId);
  return {
    player,
    currentMapId,
    mapsVisited,
    mapSequence,
    worldGrid,
    worldMapsLite: worldMaps.map(m => ({
      id: m.id, gx: m.gx, gy: m.gy,
      name: m.name, type: m.type, depth: m.depth,
      openedChests: Array.from(m.openedChests),
      visited: m.visited,
      savedEnemies: m.savedEnemies || null,
      fog: m.fog ? Array.from(m.fog) : null,
      mapTiles: m.visited ? encodeMap(m.map) : null
    }))
  };
}

function applyLoadData(data) {
  Object.assign(player, data.player);
  currentMapId = data.currentMapId;
  mapsVisited = data.mapsVisited || 0;
  mapSequence = data.mapSequence || [];
  worldGrid = data.worldGrid || {};
  attackCooldown = 0; bowCooldown = 0; bombCooldown = 0;
  transitionCooldown = 0; moveTimer = 0;
  player.invincible = 0; player.swordTimer = 0;
  enemies = []; projectiles = []; particles = []; damageNumbers = [];
  minimapCanvases = {}; minimapDirty = true;
  worldMaps = data.worldMapsLite.map(lite => {
    const md = lite.mapTiles
      ? decodeMap(lite.mapTiles)
      : (lite.type === 'village' ? buildVillageMap() : buildForestMap(lite.id, lite.depth));
    const obj = {
      id: lite.id, gx: lite.gx || 0, gy: lite.gy || 0,
      name: lite.name, type: lite.type, depth: lite.depth,
      map: md, enemyDefs: makeEnemyDefs(lite.depth, lite.type),
      openedChests: new Set(lite.openedChests), visited: lite.visited,
      savedEnemies: lite.savedEnemies || null
    };
    if (lite.fog) obj.fog = new Uint8Array(lite.fog);
    return obj;
  });
  // Rebuild worldGrid from map gx/gy if not in save (backwards compat)
  if (!data.worldGrid) {
    worldGrid = {};
    worldMaps.forEach(m => { worldGrid[gridKey(m.gx, m.gy)] = m.id; });
  }
  spawnEnemiesForMap(currentMapId);
  clampCam();
  revealAround(currentMap(), player.x, player.y, 12);
  updateHUD();
}

function renderSlotList() {
  const idx = getSaveIndex();
  const list = document.getElementById('slot-list');
  const nameRow = document.getElementById('modal-name-row');
  const modeLabel = document.getElementById('modal-mode-label');
  list.innerHTML = '';
  nameRow.style.display = 'none';
  pendingSlot = null;

  if (modalMode === 'save') {
    modeLabel.textContent = 'Choose a slot to save into, or create a new one.';
  } else {
    modeLabel.textContent = 'Choose a save to load.';
  }

  // Existing slots
  for (let i = 0; i < MAX_SLOTS; i++) {
    const meta = idx[i];
    const div = document.createElement('div');
    div.className = 'save-slot' + (meta ? '' : ' empty');

    if (meta) {
      const nameSpan = document.createElement('div');
      nameSpan.className = 'save-slot-name';
      nameSpan.textContent = meta.saveName || `Save ${i + 1}`;

      const metaSpan = document.createElement('div');
      metaSpan.className = 'save-slot-meta';
      metaSpan.textContent = `Lv${meta.level} · Map ${meta.mapsVisited + 1}/21 · ${meta.date}`;

      const btns = document.createElement('div');
      btns.className = 'save-slot-btns';

      if (modalMode === 'save') {
        const saveBtn = document.createElement('button');
        saveBtn.className = 'ssbtn';
        saveBtn.textContent = '💾 Overwrite';
        saveBtn.onclick = () => startSlotSave(i, meta.saveName);
        btns.appendChild(saveBtn);
      } else {
        const loadBtn = document.createElement('button');
        loadBtn.className = 'ssbtn';
        loadBtn.textContent = '📂 Load';
        loadBtn.onclick = () => doLoad(i);
        btns.appendChild(loadBtn);
      }

      const delBtn = document.createElement('button');
      delBtn.className = 'ssbtn danger';
      delBtn.textContent = '🗑';
      delBtn.onclick = (e) => { e.stopPropagation(); doDelete(i); };
      btns.appendChild(delBtn);

      div.appendChild(nameSpan);
      div.appendChild(metaSpan);
      div.appendChild(btns);
    } else {
      if (modalMode === 'save') {
        div.textContent = `＋ Empty Slot ${i + 1}`;
        div.onclick = () => startSlotSave(i, '');
      } else {
        div.textContent = `— Empty Slot ${i + 1}`;
      }
    }
    list.appendChild(div);
  }
}

function startSlotSave(slotIdx, existingName) {
  pendingSlot = slotIdx;
  const nameRow = document.getElementById('modal-name-row');
  const nameInput = document.getElementById('modal-name-input');
  nameInput.value = existingName || `Save ${slotIdx + 1}`;
  nameRow.style.display = 'flex';
  nameInput.focus();
  document.getElementById('modal-confirm-btn').onclick = () => doSave(slotIdx);
}

function doSave(slotIdx) {
  const nameInput = document.getElementById('modal-name-input');
  const saveName = nameInput.value.trim() || `Save ${slotIdx + 1}`;
  try {
    const data = buildSaveData();
    localStorage.setItem(SAVE_KEY_PREFIX + slotIdx, JSON.stringify(data));
    const idx = getSaveIndex();
    idx[slotIdx] = {
      saveName,
      level: player.level,
      mapsVisited,
      date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
    };
    setSaveIndex(idx);
    document.getElementById('save-status').textContent = `✅ Saved to "${saveName}"`;
    closeModal();
  } catch(e) {
    document.getElementById('save-status').textContent = '❌ Save failed (storage full?)';
  }
}

function doLoad(slotIdx) {
  const raw = localStorage.getItem(SAVE_KEY_PREFIX + slotIdx);
  if (!raw) return;
  const idx = getSaveIndex();
  const meta = idx[slotIdx];
  try {
    applyLoadData(JSON.parse(raw));
    document.getElementById('save-status').textContent = `✅ Loaded "${meta?.saveName || 'Save ' + (slotIdx+1)}"`;
    showMsg(`📂 Loaded: ${currentMap().name}`, 2500);
    closeModal();
  } catch(e) {
    document.getElementById('save-status').textContent = '❌ Load failed';
  }
}

function doDelete(slotIdx) {
  const idx = getSaveIndex();
  const name = idx[slotIdx]?.saveName || `Slot ${slotIdx + 1}`;
  if (!confirm(`Delete save "${name}"?`)) return;
  localStorage.removeItem(SAVE_KEY_PREFIX + slotIdx);
  delete idx[slotIdx];
  setSaveIndex(idx);
  renderSlotList();
}

function openSaveModal() {
  modalMode = 'save';
  document.getElementById('modal-title').textContent = '💾 Save Game';
  document.getElementById('save-modal-overlay').classList.add('open');
  renderSlotList();
}

function openLoadModal() {
  modalMode = 'load';
  document.getElementById('modal-title').textContent = '📂 Load Game';
  document.getElementById('save-modal-overlay').classList.add('open');
  renderSlotList();
}

function closeModal() {
  document.getElementById('save-modal-overlay').classList.remove('open');
  modalMode = null;
  pendingSlot = null;
}

// Close on overlay click
document.getElementById('save-modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('save-modal-overlay')) closeModal();
});

// Enter key confirms name input
document.getElementById('modal-name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && pendingSlot !== null) doSave(pendingSlot);
  if (e.key === 'Escape') closeModal();
});

function newGame() {
  if (!confirm('Start a new game? Unsaved progress will be lost.')) return;
  Object.assign(player, {
    x: EXIT_COL, y: EXIT_ROW,
    hp: 8, maxHp: 8, rupees: 0, level: 1, xp: 0, xpNext: 20,
    swordTimer: 0, swordDir: {x:0,y:-1}, invincible: 0,
    weapon: 'sword', bowLevel: 1, swordLevel: 1, defeatedBoss: false
  });
  attackCooldown = 0; bowCooldown = 0; bombCooldown = 0;
  transitionCooldown = 0; moveTimer = 0;
  enemies = []; projectiles = []; particles = []; damageNumbers = [];
  initWorld();
  revealAround(currentMap(), player.x, player.y, 12);
  spawnEnemiesForMap(0);
  clampCam();
  updateHUD();
  document.getElementById('save-status').textContent = '';
  showMsg('🌲 A new adventure begins in the Enchanted Forest!', 3500);
}

// ─── Input ────────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'Tab') { e.preventDefault(); showMinimap = !showMinimap; }
  if ([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => keys[e.key] = false);

let touchStart = {x:0,y:0};
canvas.addEventListener('touchstart', e => { const t=e.touches[0]; touchStart={x:t.clientX,y:t.clientY}; e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchend', e => {
  const t=e.changedTouches[0]; const dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y;
  const adx=Math.abs(dx), ady=Math.abs(dy);
  if (adx<12&&ady<12) { keys['z']=true; setTimeout(()=>keys['z']=false,120); }
  else if (adx>ady) { const k=dx>0?'ArrowRight':'ArrowLeft'; keys[k]=true; setTimeout(()=>keys[k]=false,160); }
  else { const k=dy>0?'ArrowDown':'ArrowUp'; keys[k]=true; setTimeout(()=>keys[k]=false,160); }
  e.preventDefault();
}, {passive:false});

// ─── Main loop ────────────────────────────────────────────────────────────────
let lastTime = 0;
function loop(ts) {
  const dt = Math.min(ts - lastTime, 80);
  lastTime = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
// Defer first resize to after browser has laid out the DOM so offsetHeight is accurate
requestAnimationFrame(() => {
  resizeCanvas();
  initWorld();
  revealAround(currentMap(), player.x, player.y, 12);
  spawnEnemiesForMap(0);
  clampCam();
  updateHUD();
  showMsg('🌲 You awaken in the Enchanted Forest… find the village after 20 maps!', 4000);
  requestAnimationFrame(loop);
});
</script>
